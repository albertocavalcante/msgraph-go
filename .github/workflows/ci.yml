name: CI

# Public fork code is not admitted to the project-scoped Runmux pool.
# Push checks validate each trusted branch head and remain visible on its PR.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: Runmux
    runs-on: air-msgraph
    permissions: {}
    steps:
      - name: Verify runner
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = aarch64
          test "$(id -u)" != 0
          case "$RUNNER_NAME" in rmx-air-*) ;; *) exit 1 ;; esac

  test:
    name: Test
    needs: canary
    runs-on: air-msgraph
    env:
      RUNNER_TOOL_CACHE: ${{ runner.temp }}/toolcache
      TMPDIR: ${{ runner.temp }}/go-tmp
      GOTMPDIR: ${{ runner.temp }}/go-tmp
      GOTOOLCHAIN: local
    steps:
      - name: Prepare writable executable tool directories
        run: mkdir -p "$RUNNER_TOOL_CACHE" "$TMPDIR"
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.2'
          cache: false
      - name: Download and verify dependencies
        run: |
          go mod download
          go mod download -modfile=ci-tools/go.mod
          go mod verify
          go mod verify -modfile=ci-tools/go.mod
          cd cmd/msgraph-docs
          go mod download
          go mod verify
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: |
          go vet ./...
          cd cmd/msgraph-docs
          go vet ./...
      - name: Test
        run: |
          go tool -modfile=ci-tools/go.mod gotestsum --format pkgname-and-test-fails -- -race ./...
          cd cmd/msgraph-docs
          go test -race ./...
          go build ./...
      - name: Lint
        run: |
          go tool -modfile=ci-tools/go.mod golangci-lint run --timeout=5m
          cd cmd/msgraph-docs
          go tool -modfile=../../ci-tools/go.mod golangci-lint run --config ../../.golangci.toml --timeout=5m
